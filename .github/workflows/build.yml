name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: ver
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Create tag (push to main only)
        if: github.ref == 'refs/heads/main'
        uses: rickstaa/action-create-tag@v1
        with:
          tag: v${{ steps.ver.outputs.version }}
          message: "Release v${{ steps.ver.outputs.version }}"
          force_push_tag: true

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller specs/mac.spec

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller specs/windows.spec

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -ry itrader-${{ github.sha }}-macos.zip iTrader.app

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cd dist
          zip -r itrader-${{ github.sha }}-windows.zip iTrader.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: itrader-${{ runner.os }}
          path: dist/itrader-${{ github.sha }}-*.zip

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.version }}
          body: Automated GitHub release for iTrader Client
          files: |
            artifacts/itrader-macOS/*.zip
            artifacts/itrader-Windows/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
