[project]
name = "itrader-client"
version = "0.2.0"
requires-python = ">=3.11"

dependencies = [
    "httpx",
    "aiosqlite",
    "pydantic>=2.0",
    "tqsdk",
    "toml",
    "cryptography>=42",
    "PySide6>=6.6",
]

[project.gui-scripts]
itrader = "itrader.__main__:run_gui"

[project.scripts]
itrader-cli = "itrader.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["itrader", "itrader.domain", "itrader.application", "itrader.infrastructure", "itrader.infrastructure.db", "itrader.infrastructure.api", "itrader.infrastructure.trading", "itrader.infrastructure.certs", "itrader.infrastructure.config", "itrader.presentation", "itrader.resources"]

[tool.setuptools.package-data]
"itrader.resources" = ["*.png"]
