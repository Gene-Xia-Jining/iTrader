[project]
name = "itrader-client"
dynamic = ["version"]
requires-python = ">=3.11"

dependencies = [
    "httpx",
    "aiosqlite",
    "pydantic>=2.0",
    "tqsdk",
    "toml",
    "PySide6>=6.6",
]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[project.gui-scripts]
itrader = "src.__main__:run_gui"

[project.scripts]
itrader-cli = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src", "src.domain", "src.application", "src.infrastructure", "src.infrastructure.db", "src.infrastructure.api", "src.infrastructure.trading", "src.infrastructure.config", "src.presentation", "src.resources"]

[tool.setuptools.package-data]
"src.resources" = ["*.png"]
